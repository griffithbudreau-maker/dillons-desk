<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dillon's Desk</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--ground:#F4F2ED;--panel:#FFFFFF;--ink:#1E1A16;--ink-2:#5C544B;--ink-3:#8E857A;--line:#E4DFD6;--line-2:#CFC8BC;--accent:#7A3E1D;--accent-soft:#F3E4D8;--crit:#B23A2F;--crit-soft:#F8E3E0;--shadow:0 1px 2px rgba(30,26,22,.06),0 12px 32px -14px rgba(30,26,22,.25)}
@media (prefers-color-scheme:dark){:root{--ground:#16130F;--panel:#1F1B16;--ink:#EDE7DC;--ink-2:#B5AC9E;--ink-3:#7E766B;--line:#2E2822;--line-2:#463E35;--accent:#D98B5A;--accent-soft:#3A2618;--crit:#E5655A;--crit-soft:#3D1F1B;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:16px}
.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:28px 26px 24px}
h1{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:34px;line-height:1;margin:0 0 4px;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.sub{color:var(--ink-3);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:22px}
label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.row{display:flex;gap:8px}
input[type=password],input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line-2);border-radius:6px;background:var(--ground);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
button{font:inherit;font-weight:600;font-size:14px;padding:11px 18px;border:0;border-radius:6px;background:var(--ink);color:var(--ground);cursor:pointer}
button:hover{background:var(--accent)} button:disabled{opacity:.6;cursor:wait}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-top:14px}
.remember input{accent-color:var(--accent)}
.err{display:none;margin-top:12px;font-size:13px;color:var(--crit);background:var(--crit-soft);padding:8px 10px;border-radius:5px}
.foot{margin-top:20px;font-size:11px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px}
</style></head><body>
<form class="card" id="f" autocomplete="off">
  <h1>Dillon's <em>Desk</em></h1>
  <div class="sub">Private · unlock to open</div>
  <label for="pw">Password</label>
  <div class="row"><input id="pw" type="password" autocomplete="current-password" autofocus required><button id="go" type="submit">Unlock</button></div>
  <label class="remember"><input id="keep" type="checkbox"> Stay unlocked on this device</label>
  <div class="err" id="err"></div>
  <div class="foot" id="foot">Built <span id="built">—</span> · nothing here is readable without the password — not by GitHub, not by anyone with the link.</div>
</form>
